# Builds the bootc image (amd64), lints it, pushes <tag>.
version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - |
        set -eo pipefail
        export IMAGE_TAG="${COMMIT_ID:0:12}-${EXECUTION_ID:0:8}"
        export IMAGE="$IMAGE_REPO_URL:$IMAGE_TAG"
        echo "Building $IMAGE from $REPO_ID@$COMMIT_ID"
        podman info --format '{{.Store.GraphDriverName}} on {{.Store.GraphRoot}}'
        aws ecr get-login-password | podman login --username AWS --password-stdin "$REGISTRY"
        if [ -n "${RH_REGISTRY_USERNAME:-}" ]; then
          echo "$RH_REGISTRY_PASSWORD" | podman login --username "$RH_REGISTRY_USERNAME" --password-stdin registry.redhat.io
        fi

  build:
    commands:
      - |
        set -eo pipefail
        # BUILD_ARGS is a space-separated list of --build-arg k=v; word splitting is intended.
        # shellcheck disable=SC2086
        podman build \
          --pull=always \
          --file "$CONTAINERFILE" \
          --tag "$IMAGE" \
          --label "org.opencontainers.image.source=$REPO_ID" \
          --label "org.opencontainers.image.revision=$COMMIT_ID" \
          --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --build-arg "IMAGE_REPO_URL=$IMAGE_REPO_URL" \
          --build-arg "COSIGN_PUBLIC_KEY_B64=${COSIGN_PUBLIC_KEY_B64:-}" \
          --build-arg "REQUIRE_SBOM=${ENABLE_SBOM:-false}" \
          $BUILD_ARGS \
          "$BUILD_CONTEXT"
      # Fails the build on anything bootc would reject at install or upgrade time.
      - podman run --rm "$IMAGE" bootc container lint

  post_build:
    commands:
      - |
        set -eo pipefail
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
          podman push "$IMAGE"
          echo "Pushed $IMAGE"
        fi
