# Generates an SPDX SBOM for the image pushed by Build and attaches it as a
# cosign attestation signed with the KMS key. Runs before Publish, so the
# channel tag only ever points at an attested digest.
version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - |
        set -eo pipefail
        export IMAGE_TAG="${COMMIT_ID:0:12}-${EXECUTION_ID:0:8}"
        aws ecr get-login-password | podman login --username AWS --password-stdin "$REGISTRY"
        IMAGE_DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE_REPO_URL:$IMAGE_TAG")"
        export IMAGE_DIGEST
        echo "Attesting $IMAGE_REPO_URL:$IMAGE_TAG@$IMAGE_DIGEST"

  build:
    commands:
      - syft scan "registry:$IMAGE_REPO_URL@$IMAGE_DIGEST" -o spdx-json=sbom.spdx.json
      - |
        set -eo pipefail
        cosign attest --yes --tlog-upload=false \
          --key "awskms:///$SIGNING_KEY_ARN" \
          --type spdxjson --predicate sbom.spdx.json \
          "$IMAGE_REPO_URL@$IMAGE_DIGEST"
        echo "Attested SBOM ($(jq '.packages | length' sbom.spdx.json) packages) for $IMAGE_DIGEST"

# The SBOM is also kept as a pipeline artifact for download.
artifacts:
  files:
    - sbom.spdx.json
