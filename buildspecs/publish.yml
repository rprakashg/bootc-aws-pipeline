# Resolves the image pushed by Build to its digest, signs it with cosign (KMS),
# then moves the channel tag to that digest. The SBOM stage has already attested it.
version: 0.2

env:
  shell: bash
  exported-variables:
    - IMAGE_TAG
    - IMAGE_DIGEST

phases:
  pre_build:
    commands:
      - |
        set -eo pipefail
        export IMAGE_TAG="${COMMIT_ID:0:12}-${EXECUTION_ID:0:8}"
        aws ecr get-login-password | podman login --username AWS --password-stdin "$REGISTRY"

  build:
    commands:
      - |
        set -eo pipefail
        IMAGE_DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE_REPO_URL:$IMAGE_TAG")"
        export IMAGE_DIGEST
        echo "Publishing $IMAGE_REPO_URL:$IMAGE_TAG@$IMAGE_DIGEST"
      - |
        set -eo pipefail
        if [ -n "${SIGNING_KEY_ARN:-}" ]; then
          # Private registry: keep signatures in ECR only, nothing goes to the public Rekor log.
          cosign sign --yes --tlog-upload=false \
            --key "awskms:///$SIGNING_KEY_ARN" \
            -a "commit=$COMMIT_ID" -a "repo=$REPO_ID" \
            "$IMAGE_REPO_URL@$IMAGE_DIGEST"
        fi
      - |
        set -eo pipefail
        skopeo copy --preserve-digests \
          "docker://$IMAGE_REPO_URL@$IMAGE_DIGEST" "docker://$IMAGE_REPO_URL:$CHANNEL_TAG"
        echo "Moved :$CHANNEL_TAG -> $IMAGE_DIGEST"
